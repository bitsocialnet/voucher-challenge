name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [master]

# Two runs at once would both bump and tag from the same master, and the second push would be rejected.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Set up Git author
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # Exits 0 when there are no commits since the latest tag (git.requireCommitsFail is false), so any
      # failure, such as a rejected push, stops the job before a locally bumped version is published.
      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci

      # Decide from the registry rather than from a bump in this run, so a re-run publishes a version
      # that was tagged and released on GitHub but never reached npm.
      - name: Check if the version is on npm
        id: npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm"
            echo "missing=false" >> $GITHUB_OUTPUT
          else
            echo "$NAME@$VERSION is not on npm"
            echo "missing=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.npm.outputs.missing == 'true'
        run: npx --yes npm@latest publish --access public --provenance
